services:
  - type: web
    name: spaces-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
